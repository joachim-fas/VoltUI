<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Grain UI — Component Library</title>

    <!--
      Typografie-System v3 — Lesbarkeit als Designprinzip
      ────────────────────────────────────────────────────
      Display:  Bricolage Grotesque — Expressiv, geometrisch, hohe x-Höhe
                Ideal für Headlines: unverwechselbar aber klar lesbar
      UI:       DM Sans — Neutral, modern, ausgezeichnete Lesbarkeit
                Optimiert für Interface-Text, Labels, Buttons
      Body:     Lora — Humanistisch, warm, hervorragende Lesbarkeit
                Ideal für längere Texte, Beschreibungen, Fließtext
      Mono:     JetBrains Mono — Ligatures, klare Unterscheidung
                Speziell für Code und technische Inhalte
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
